
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Email Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f3f6fc;
            color: #263248;
        }

        .container {
            max-width: 750px;
            margin: 30px auto;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

            .header h1 {
                color: #2857a4;
                margin-bottom: 10px;
            }

            .header p {
                color: #718096;
                font-size: 14px;
            }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d6deeb;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }

            input:focus, textarea:focus, select:focus {
                border-color: #2857a4;
                box-shadow: 0 0 0 2px rgba(40,87,164,0.1);
            }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .generate-btn {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #2857a4;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

            .generate-btn:hover {
                background: #1d4385;
            }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-section {
            display: none;
            margin-top: 30px;
        }

            .result-section h3 {
                color: #2857a4;
            }

        #result {
            padding: 18px;
            background: #f5f8fd;
            border: 1px solid #dce5f2;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.7;
            min-height: 100px;
        }

        .copy-btn {
            margin-top: 12px;
            padding: 11px 20px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #error {
            color: #d32f2f;
            margin-top: 15px;
            font-size: 14px;
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #2857a4;
        }

        @media (max-width: 600px) {
            .container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>✨ AI Email Generator</h1>
            <p>Create professional emails quickly with the help of AI.</p>
        </div>

        <form id="emailForm">

            <label for="purpose">Email Purpose</label>
            <input type="text"
                   id="purpose"
                   placeholder="Example: Request for project update"
                   maxlength="100"
                   required>

            <label for="recipient">Recipient</label>
            <input type="text"
                   id="recipient"
                   placeholder="Example: Project Manager"
                   maxlength="100"
                   required>

            <label for="keyPoints">Key Points</label>
            <textarea id="keyPoints"
                      placeholder="Enter the important points to include in the email..."
                      maxlength="1000"
                      required></textarea>

            <label for="tone">Email Tone</label>
            <select id="tone" required>
                <option value="Professional">Professional</option>
                <option value="Friendly">Friendly</option>
                <option value="Formal">Formal</option>
                <option value="Casual">Casual</option>
            </select>

            <button type="submit"
                    class="generate-btn"
                    id="generateButton">
                ✨ Generate Email
            </button>

        </form>

        <div id="loading">
            Generating your email... Please wait.
        </div>

        <div id="error"></div>

        <div class="result-section" id="resultSection">

            <h3>Generated Email</h3>

            <div id="result"></div>

            <button type="button"
                    class="copy-btn"
                    id="copyButton">
                📋 Copy Email
            </button>

        </div>

    </div>

    <script>

        const emailForm = document.getElementById("emailForm");

        const generateButton =
            document.getElementById("generateButton");

        const resultDiv =
            document.getElementById("result");

        const resultSection =
            document.getElementById("resultSection");

        const errorDiv =
            document.getElementById("error");

        const loadingDiv =
            document.getElementById("loading");

        // Generate Email
        emailForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            errorDiv.textContent = "";
            resultSection.style.display = "none";

            generateButton.disabled = true;
            loadingDiv.style.display = "block";

            const requestData = {
                purpose: document.getElementById("purpose").value,
                recipient: document.getElementById("recipient").value,
                keyPoints: document.getElementById("keyPoints").value,
                tone: document.getElementById("tone").value
            };

            try {

                const response = await fetch("/api/Email/generate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();

                if (!response.ok) {

                    const validationErrors = data.errors
                        ? Object.values(data.errors).flat().join(" ")
                        : null;

                    throw new Error(
                        validationErrors ||
                        data.message ||
                        data.title ||
                        "Unable to generate email."
                    );
                }

                resultDiv.textContent = data.generatedEmail;

                resultSection.style.display = "block";

            }
            catch (error) {

                errorDiv.textContent = error.message;

            }
            finally {

                generateButton.disabled = false;
                loadingDiv.style.display = "none";

            }

        });

        // Copy Generated Email
        document.getElementById("copyButton")
            .addEventListener("click", async function () {

                try {

                    await navigator.clipboard.writeText(
                        resultDiv.textContent
                    );

                    this.textContent = "Copied!";

                }
                catch (error) {

                    errorDiv.textContent =
                        "Unable to copy. Please select and copy the email manually.";

                }

            });

    </script>

</body>
</html>
